version: '3.8'

services:
  # Database Service: PostgreSQL 15
  db:
    image: postgres:15-alpine
    container_name: rebone_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rebone_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rebone_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web API Service: FastAPI + Uvicorn
  web:
    build: .
    container_name: rebone_fastapi_web
    restart: always
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rebone_db
      SECRET_KEY: rebone_ai_super_secret_jwt_key_2026_change_in_production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
